<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Paneli · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <p id="mesaj" hidden></p>

    <section class="kart">
      <h2>Menü doluluk ve puan raporu</h2>
      <form id="rapor-formu" class="satir-form rapor-form">
        <div><label for="r-baslangic">Başlangıç</label><input id="r-baslangic" type="date"></div>
        <div><label for="r-bitis">Bitiş</label><input id="r-bitis" type="date"></div>
      </form>
      <div class="tablo-kaydir">
        <table class="rapor-tablo">
          <thead>
            <tr><th>Menü</th><th>Doluluk</th><th>Puan</th><th></th></tr>
          </thead>
          <tbody id="rapor"></tbody>
        </table>
      </div>
    </section>

    <section class="kart" id="form-kart">
      <h2 id="form-baslik">Yeni menü</h2>
      <form id="menu-formu">
        <div class="satir-form">
          <div class="tam">
            <label for="m-yemekhane">Yemekhane</label>
            <select id="m-yemekhane" name="yemekhaneId"></select>
          </div>
          <div>
            <label for="m-tarih">Tarih</label>
            <input id="m-tarih" name="tarih" type="date" required>
          </div>
          <div>
            <label for="m-ogun">Öğün</label>
            <select id="m-ogun" name="ogunId"></select>
          </div>
          <div>
            <label for="m-ogrenci">Öğrenci fiyatı</label>
            <input id="m-ogrenci" name="ogrenciFiyati" type="number" min="0.5" max="10000" step="0.5" required>
          </div>
          <div>
            <label for="m-personel">Personel fiyatı</label>
            <input id="m-personel" name="personelFiyati" type="number" min="0.5" max="10000" step="0.5" required>
          </div>
        </div>
        <div class="alan yemek-alani">
          <label for="m-ara">Yemekler <span class="soluk" id="secili-sayi"></span></label>
          <input id="m-ara" type="search" placeholder="Yemek ara">
          <div class="yemek-secim" id="yemekler"></div>
        </div>
        <div class="dugmeler">
          <button class="dugme" type="submit" id="kaydet">Menüyü oluştur</button>
          <button class="dugme dugme-ikincil gizli" type="button" id="vazgec">Vazgeç</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/yonetici.js"></script>
</body>
</html>
