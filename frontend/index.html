<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <section class="giris-kutusu kart">
      <div class="logo" aria-hidden="true">🍽</div>
      <h1>Kampüs Yemekhanesi</h1>
      <p class="soluk">Menüleri görmek, rezervasyon yapmak ve bakiyeni yönetmek için giriş yap.</p>

      <form id="giris-formu" novalidate>
        <div class="alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required>
        </div>
        <div class="alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <p id="mesaj" hidden></p>
        <button class="dugme dugme-tam" type="submit">Giriş yap</button>
      </form>
    </section>
  </main>

  <script src="/js/ortak.js"></script>
  <script>
    const form = document.getElementById('giris-formu');
    const mesaj = document.getElementById('mesaj');

    // Zaten oturum açıksa doğrudan menüye geç
    api('/ben').then(() => { location.href = '/menu.html'; }).catch(() => {});

    form.addEventListener('submit', async (olay) => {
      olay.preventDefault();
      const dugme = form.querySelector('button');
      dugme.disabled = true;
      try {
        await api('/giris', {
          yontem: 'POST',
          govde: { eposta: form.eposta.value, sifre: form.sifre.value },
        });
        location.href = '/menu.html';
      } catch (hata) {
        bildir(mesaj, hata.message);
        dugme.disabled = false;
      }
    });
  </script>
</body>
</html>
